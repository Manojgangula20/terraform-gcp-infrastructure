name: Terraform CI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      terraform_directory: environments/dev
      project_id: future-pager-404616
      run_plan: true
      enable_gcp_auth: true
      workload_identity_provider: "projects/25139972221/locations/global/workloadIdentityPools/github-actions/providers/github"
      service_account: "terraform-github@future-pager-404616.iam.gserviceaccount.com"
