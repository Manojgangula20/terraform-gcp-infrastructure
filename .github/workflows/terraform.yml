name: Terraform CI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      terraform_directory: environments/dev
      run_plan: true
      enable_gcp_auth: false
